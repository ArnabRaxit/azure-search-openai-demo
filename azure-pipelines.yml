trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Step 1: Install AZD directly into the runner environment without using any Marketplace tasks
- task: Bash@3
  displayName: Install azd
  inputs:
    targetType: 'inline'
    script: |
      curl -fsSL https://aka.ms/install-azd.sh | bash
- pwsh: |
    azd config set auth.useAzCliAuth "true"
  displayName: Configure AZD to Use AZ CLI Authentication.
# Step 3: Use the Azure CLI Task to deploy. 
# This automatically handles login so you don't need 'azd auth login' or credentials!
- task: AzureCLI@2
  displayName: 'Configure and Deploy AI App via AZD'
  inputs:
    azureSubscription: 'kindy-azure-ARM'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # Inform azd to use the Azure CLI auth context managed by this DevOps task
      export AZD_AUTH_USE_AZURE_CLI=true
      
      # 1. Initialize your specific environment name
      azd env new kindy
      
      # 2. Map pipeline variables directly into your azd workspace configuration
      azd env set AZURE_SUBSCRIPTION_ID "9d3525cb-61bb-4699-a3a3-41cd190bc3d9"
      azd env set AZURE_LOCATION "australiasoutheast"
      azd env set infra.parameters.openAiLocation "australiaeast"
      azd env set infra.parameters.documentIntelligenceResourceGroupLocation "australiaeast"
      
      # 3. Provision the Azure resources and deploy the code
      azd up --no-prompt

