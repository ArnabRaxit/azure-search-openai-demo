trigger:
  - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: AzureCLI@2
  displayName: 'Install AZD and Deploy AI App'
  inputs:
    azureSubscription: 'Your-Azure-Service-Connection-Name'
    scriptType: 'bash'
    scriptLocation: 'inlineScript'
    inlineScript: |
      # 1. Install the Azure Developer CLI on the agent
      curl -fsSL https://aka.ms | bash
      
      # 2. Log in using the pipeline's system token
      azd auth login --client-id $(AZURE_CLIENT_ID) --client-secret $(AZURE_CLIENT_SECRET) --tenant-id $(AZURE_TENANT_ID)
      
      # 3. Set your target subscription and region parameters
      azd env new kindy
      azd env set AZURE_SUBSCRIPTION_ID "9d3525cb-61bb-4699-a3a3-41cd190bc3d9"
      azd env set AZURE_LOCATION "australiasoutheast"
      azd env set openAiLocation "australiaeast"
      azd env set documentIntelligenceResourceGroupLocation "australiaeast"
      
      # 4. Provision and deploy
      azd up --no-prompt
